name: probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers; uname -m
          ls -d /Applications/Xcode*.app
          for x in /Applications/Xcode_*.app; do echo "$x: $("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1)"; done
          ls /Library/Developer/KDKs 2>/dev/null || true
